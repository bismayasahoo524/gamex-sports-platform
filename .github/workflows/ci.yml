name: GameX CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

jobs:

  # ============================================================
  # CORE SERVICES
  # ============================================================

  core-ci:
    name: Core Services CI
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - event-service
          - registration-service
          - match-service
          - notification-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Detect service directory
        id: service
        shell: bash
        run: |
          if [ -d "backend/${{ matrix.service }}" ]; then
            echo "path=backend/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          elif [ -d "services/${{ matrix.service }}" ]; then
            echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          else
            echo "Service directory not found: ${{ matrix.service }}"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.service.outputs.path }}
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-cov ruff

      - name: Lint
        working-directory: ${{ steps.service.outputs.path }}
        run: |
          ruff check .

      - name: Run unit tests
        working-directory: ${{ steps.service.outputs.path }}
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pytest tests \
              --cov=. \
              --cov-report=term-missing \
              --cov-report=xml \
              --junitxml=test-results.xml
          else
            echo "No tests directory found for ${{ matrix.service }}"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.service }}-test-results
          path: |
            ${{ steps.service.outputs.path }}/test-results.xml
            ${{ steps.service.outputs.path }}/coverage.xml
          if-no-files-found: ignore


  # ============================================================
  # AI SERVICES
  # ============================================================

  ai-ci:
    name: AI Services CI
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-gateway
          - ai-copilot
          - rag-engine
          - prediction-engine
          - schedule-optimizer
          - anomaly-detection

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check AI service directory
        shell: bash
        run: |
          if [ ! -d "ai/${{ matrix.service }}" ]; then
            echo "AI service directory not found: ${{ matrix.service }}"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ai/${{ matrix.service }}
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-cov ruff

      - name: Lint
        working-directory: ai/${{ matrix.service }}
        run: |
          ruff check .

      - name: Run unit tests
        working-directory: ai/${{ matrix.service }}
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pytest tests \
              --cov=. \
              --cov-report=term-missing \
              --cov-report=xml \
              --junitxml=test-results.xml
          else
            echo "No tests directory found for ${{ matrix.service }}"
          fi

      - name: Upload AI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-${{ matrix.service }}-test-results
          path: |
            ai/${{ matrix.service }}/test-results.xml
            ai/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore