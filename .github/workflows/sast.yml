name: GameX SAST

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

          find backend services ai \
            -name requirements.txt \
            -type f \
            -print \
            -exec pip install -r {} \;

      - name: Run tests and generate coverage
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pytest tests \
              --cov=backend \
              --cov=services \
              --cov=ai \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
          else
            echo "No tests directory found."
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Uncomment this later when you want the pipeline
      # to stop if the SonarQube Quality Gate fails.

      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}